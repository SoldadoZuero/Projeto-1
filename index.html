<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Soma</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <div class="calculadora">
        <h1>Calculadora de Soma</h1>

        <form id="formulario">
            <input id="num1" placeholder="Primeiro número ex(1, -6, 2.5)">

            <span class="operador">+</span>

            <input id="num2" placeholder="Segundo número ex(5, -6, 0.7)">

            <button type="submit" id="somar">Somar</button>

            <input id="resultado" type="text" placeholder="Resultado" readonly>
        </form>
    </div>

</body>
</html>
